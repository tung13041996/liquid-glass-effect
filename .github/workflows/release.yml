name: Release

# Push a tag like v1.0.1 to publish a GitHub Release
# with liquid-glass.min.js attached as the download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/liquid-glass.min.js
          generate_release_notes: true
          body: |
            ## Install

            Download **liquid-glass.min.js** below, or load it from the CDN:

            ```html
            <script src="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/dist/liquid-glass.min.js"></script>
            ```
