<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid glass: element example</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f4; }
  /* utility classes from the theme */
  .ps-relative { position: relative; } .ps-absolute { position: absolute; }
  .t0 { top: 0; } .l0 { left: 0; } .b0 { bottom: 0; } .r0 { right: 0; } .z2 { z-index: 2; }

  .element { height: 620px; max-width: 1200px; margin: 40px auto; overflow: hidden; }
  .element_image { background: url("../assets/default-bg.webp") center / cover no-repeat; }
  .element_content { position: absolute; left: 60px; bottom: 60px; width: min(520px, calc(100% - 120px)); }
  .element_layer { border-radius: 32px; }
  .element_text { position: relative; z-index: 1; padding: 40px; color: #fff; }   /* content above the glass */
  .element_text h2 { margin: 0 0 12px; font-size: 40px; }
  .element_text p { margin: 0; line-height: 1.6; }
</style>
</head>
<body>

<div class="element ps-relative">
  <div class="element_image ps-absolute t0 l0 b0 r0"></div>
  <div class="element_content ps-relative z2">
    <div class="element_layer ps-absolute t0 l0 b0 r0"
         data-liquid-glass='{"lightAngle":-45,"lightIntensity":80,"refraction":100,"depth":57,"dispersion":100,"frost":1,"splay":100,"fillOpacity":10}'></div>
    <div class="element_text">
      <h2>Our journey</h2>
      <p>The glass refracts the image behind it. The text sits above the glass and stays sharp.</p>
    </div>
  </div>
</div>

<script src="../dist/liquid-glass.min.js"></script>
<script>LiquidGlass.init();</script>
</body>
</html>
